<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>IRON COACH</title>
<style>
:root{--accent:#ff6a00;--bg:#0b0c0f;--panel:#15171c;--panel2:#1d2027;--text:#f5f6f8;--muted:#a5a9b3;--line:#2c3039;--good:#42c98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:var(--accent);color:#111;font-weight:750}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:not-allowed}
header{position:sticky;top:0;z-index:5;background:#0b0c0fee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px max(16px,calc((100% - 980px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:950;letter-spacing:1.4px;font-size:20px}.brand span{color:var(--accent)}.wrap{max-width:980px;margin:auto;padding:20px 16px 100px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}h1{font-size:30px;line-height:1.1;margin:8px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,select{width:100%;background:#0e1014;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text)}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}.stat{font-size:25px;font-weight:850}.nav{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#101116f2;border-top:1px solid var(--line);backdrop-filter:blur(15px)}.nav button{background:transparent;color:var(--muted);padding:9px 10px;font-size:12px;flex:1;max-width:150px}.nav button.active{color:var(--accent);background:#ffffff0c}.exercise{display:flex;gap:12px;align-items:flex-start}.exercise .num{background:var(--panel2);border-radius:10px;padding:9px 11px;font-weight:800;color:var(--accent)}.exercise p{margin:4px 0;color:var(--muted);font-size:13px}.hidden{display:none!important}.notice{padding:11px 13px;border-radius:12px;background:#252017;color:#f5d9a4;font-size:13px}.progress{height:7px;background:#292d35;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}.video{display:block;width:100%;border-radius:12px;overflow:hidden;background:#090a0d;border:1px solid var(--line);padding:15px;color:var(--text);text-decoration:none}.video strong{display:block;margin-bottom:4px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.empty{text-align:center;padding:28px 12px;color:var(--muted)}footer{text-align:center;color:#777;font-size:11px;padding:20px}
@media(min-width:700px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding-top:28px}}
</style></head>
<body>
<header><div class="brand">IRON <span>COACH</span></div><div id="headerProfile" class="tiny">Coach sportif personnel</div></header>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav"><button data-page="home" class="active">Accueil</button><button data-page="program">Programme</button><button data-page="session">Séance</button><button data-page="history">Suivi</button><button data-page="coach">Coach IA</button><button data-page="profiles">Profils</button></nav>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gyms={basic:{name:'Basic-Fit',accent:'#ff6a00'},onair:{name:'On Air Fitness',accent:'#ed3038'},fitness:{name:'Fitness Park',accent:'#f3d21b'}};
const goals={muscle:['Prise de muscle','Développer progressivement les muscles avec un entraînement régulier et une progression maîtrisée.'],strength:['Force','Améliorer la capacité à produire un effort, en privilégiant la technique et une progression prudente.'],endurance:['Endurance','Apprendre à maintenir un effort plus longtemps et améliorer sa condition physique.'],fitness:['Remise en forme','Reprendre ou installer une activité physique régulière et développer les capacités générales.'],sport:['Préparation physique','Développer des qualités utiles à un sport précis, en complément de son entraînement sportif.']};
const exercises=[
{name:'Développé couché machine',muscles:'Pectoraux, triceps',sets:3,reps:'8–12',rest:90,tip:'Garde les épaules stables et contrôle le retour. Arrête si une douleur apparaît.',video:'développé couché machine technique'},
{name:'Tirage vertical',muscles:'Dos, biceps',sets:3,reps:'8–12',rest:90,tip:'Tire vers le haut de la poitrine sans donner d’élan et sans tirer derrière la nuque.',video:'tirage vertical prise devant technique'},
{name:'Rowing assis poulie',muscles:'Dos, biceps',sets:3,reps:'10–12',rest:90,tip:'Grandis-toi, garde le buste stable et ramène les coudes sans arrondir le dos.',video:'rowing assis poulie technique'},
{name:'Élévations latérales légères',muscles:'Épaules',sets:2,reps:'12–15',rest:60,tip:'Utilise une charge légère, monte sans élan et garde le mouvement confortable.',video:'élévations latérales haltères technique'},
{name:'Curl biceps',muscles:'Biceps',sets:2,reps:'10–12',rest:60,tip:'Garde les coudes près du corps et évite de balancer le buste.',video:'curl biceps haltères technique'},
{name:'Extension triceps à la poulie',muscles:'Triceps',sets:2,reps:'10–15',rest:60,tip:'Garde les coudes proches du corps et contrôle le mouvement.',video:'extension triceps poulie technique'},
{name:'Presse à cuisses',muscles:'Quadriceps, fessiers',sets:2,reps:'10–12',rest:90,tip:'Garde le dos en contact avec le dossier et utilise une amplitude confortable.',video:'presse à cuisses technique'},
{name:'Gainage',muscles:'Abdominaux',sets:2,reps:'20–30 sec',rest:45,tip:'Garde le corps aligné et respire normalement.',video:'gainage planche technique'}
];
let db;try{db=JSON.parse(localStorage.getItem('ironCoachV1')||'{"profiles":[],"active":null,"logs":[]}');}catch(loadError){console.error('IRON COACH saved data could not be read:',loadError);db={profiles:[],active:null,logs:[]};}if(!db||!Array.isArray(db.profiles)||!Array.isArray(db.logs)){console.warn('IRON COACH data structure repaired safely');db={profiles:[],active:null,logs:[]};}
let page='home',mode='classic',timerId=null,seconds=0,currentIndex=0;
function save(){localStorage.setItem('ironCoachV1',JSON.stringify(db))}
function profile(){return db.profiles.find(p=>p.id===db.active)}
function theme(){let p=profile();let g=gyms[p?.gym]||gyms.basic;document.documentElement.style.setProperty('--accent',g.accent);let h=$('#headerProfile');if(h)h.textContent=p?(p.name||'Profil')+' · '+g.name:'Coach sportif personnel'}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function btn(label,fn,cls=''){return '<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>'}
function home(){let p=profile();if(!p)return '<section class="card"><span class="pill">BIENVENUE</span><h1>Ton entraînement,<br>mieux organisé.</h1><p class="muted">Crée ton profil pour obtenir un programme adapté à ta salle, ton expérience et tes objectifs.</p>'+btn('Créer mon profil',"go('profiles')")+'</section>';
let logs=(db.logs||[]).filter(x=>x.pid===p.id);return '<div class="topline"><span class="pill">'+esc((gyms[p.gym]||gyms.basic).name)+'</span><span class="pill">'+esc(p.level||'Niveau à évaluer')+'</span></div><h1>Bonjour '+esc(p.name)+' 👋</h1><p class="muted">Voici ton espace d’entraînement.</p><div class="grid three"><div class="card"><div class="tiny">Séances enregistrées</div><div class="stat">'+logs.length+'</div></div><div class="card"><div class="tiny">Objectif</div><b>'+esc(goals[p.goal]?.[0]||'À choisir')+'</b></div><div class="card"><div class="tiny">Programme</div><b>'+ (p.plan?'Prêt':'À créer')+'</b></div></div><div class="card"><h2>Ton prochain entraînement</h2><p class="muted">'+(p.plan?'Programme personnalisé disponible. Pense à adapter les charges à tes sensations.':'Complète ton questionnaire pour générer ton programme.')+'</p><div class="actions">'+btn(p.plan?'Voir mon programme':'Créer mon programme',"go('program')")+' '+btn('Démarrer une séance',"go('session')",'secondary')+'</div></div><div class="card"><h2>Rappel du coach</h2><p class="muted">La qualité du mouvement passe avant la charge. Augmente progressivement, prends tes temps de repos et arrête un exercice en cas de douleur.</p></div>'}
function profilePage(){return '<h1>Profils</h1><p class="muted">Chaque profil conserve ses propres préférences, programme et historique sur cet appareil.</p><div class="card"><h2>Profil actif</h2>'+(profile()?'<b>'+esc(profile().name)+'</b><p class="muted">'+esc(gyms[profile().gym].name)+' · '+esc(goals[profile().goal]?.[0]||'Objectif à choisir')+'</p>':'<p class="muted">Aucun profil sélectionné.</p>')+'</div><div class="card"><h2>Créer un profil</h2><div class="field"><label>Prénom ou pseudo</label><input id="pname" maxlength="24" placeholder="Ex. Alex"></div><div class="field"><label>Salle habituelle</label><select id="gym"><option value="basic">Basic-Fit</option><option value="onair">On Air Fitness</option><option value="fitness">Fitness Park</option></select></div><button onclick="createProfile()">Créer le profil</button></div><div class="card"><h2>Changer de profil</h2>'+(db.profiles.map(p=>'<div class="topline" style="padding:9px 0"><div><b>'+esc(p.name)+'</b><div class="tiny">'+esc(gyms[p.gym].name)+'</div></div>'+btn(p.id===db.active?'Actif':'Utiliser',"activate('"+p.id+"')",'secondary')+'</div>').join('')||'<p class="muted">Aucun autre profil.</p>')+'</div><div class="card"><h2>Sauvegarde</h2><p class="tiny">Les données sont stockées dans ce navigateur uniquement. Exporte régulièrement une copie pour éviter de les perdre.</p><div class="actions">'+btn('Exporter mes données','exportData()','secondary')+'<label class="secondary" style="padding:12px;border-radius:12px;cursor:pointer">Importer<input type="file" accept="application/json" hidden onchange="importData(event)"></label></div></div>'}
function createProfile(){let name=$('#pname').value.trim();if(!name){alert('Entre un prénom ou un pseudo.');return}let p={id:crypto.randomUUID(),name,gym:$('#gym').value,goal:'muscle',level:'À évaluer',plan:false,experience:'',days:'3',sport:''};db.profiles.push(p);db.active=p.id;save();theme();go('program')}
function activate(id){db.active=id;save();theme();go('home')}
function program(){let p=profile();if(!p)return '<div class="empty">Crée d’abord un profil.</div>'+btn('Aller aux profils',"go('profiles')");return '<h1>Ton programme</h1><p class="muted">Questionnaire de départ et programme modifiable.</p><div class="card"><h2>1. Choisis ton objectif</h2><div class="grid">'+Object.entries(goals).map(([k,v])=>'<label class="card check" style="margin:0"><input type="radio" name="goal" value="'+k+'" '+(p.goal===k?'checked':'')+'><span><b>'+v[0]+'</b><div class="tiny">'+v[1]+'</div></span></label>').join('')+'</div><div class="notice" style="margin-top:12px">Tu hésites ? Prise de muscle = développer les muscles ; force = améliorer la capacité à pousser/tirer ; endurance = tenir plus longtemps ; remise en forme = condition générale ; préparation physique = objectif lié à un sport.</div></div><div class="card"><h2>2. Ton profil physique et tes priorités</h2>
<p class="muted">Ces informations aident à personnaliser les conseils. La taille, le poids et la morphologie ne déterminent pas à eux seuls le meilleur programme.</p>
<div class="grid">
<div class="field"><label>Âge</label><input id="age" type="number" min="13" max="99" placeholder="Ex. 17"></div>
<div class="field"><label>Taille (cm)</label><input id="height" type="number" min="100" max="230" placeholder="Ex. 175"></div>
<div class="field"><label>Poids (kg) — facultatif</label><input id="weight" type="number" min="30" max="250" step=".1" placeholder="Ex. 68"></div>
<div class="field"><label>Morphologie perçue</label><select id="build"><option value="unsure">Je ne sais pas</option><option value="slim">Plutôt mince</option><option value="average">Plutôt moyenne</option><option value="broad">Plutôt large</option></select></div>
</div>
<div class="field"><label>Quel groupe musculaire veux-tu davantage développer ?</label><select id="focus"><option value="balanced">Tout le corps de façon équilibrée</option><option value="chest">Pectoraux</option><option value="back">Dos</option><option value="shoulders">Épaules</option><option value="arms">Bras</option><option value="legs">Jambes et fessiers</option><option value="core">Abdominaux et gainage</option></select></div>
<div class="notice">La morphologie ne permet pas de prédire les résultats ni de classer les personnes. Le coach privilégie les objectifs, l'expérience, la récupération et les préférences.</div></div>
<div class="card"><h2>3. Évaluation de ton expérience</h2><div class="field"><label>Depuis combien de temps pratiques-tu la musculation ?</label><select id="experience"><option value="new">Je débute ou moins de 3 mois</option><option value="some">Entre 3 mois et 1 an</option><option value="regular">Entre 1 et 2 ans</option><option value="long">Plus de 2 ans</option></select></div><div class="field"><label>Combien de séances par semaine peux-tu raisonnablement faire ?</label><select id="days"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div class="field"><label>Tu prépares un sport en particulier ? (facultatif)</label><input id="sport" placeholder="Ex. football, basket…"></div><div class="field"><label>As-tu une gêne ou une limitation à prendre en compte ?</label><input id="limits" placeholder="Facultatif — ne remplace pas un avis médical"></div><button onclick="buildPlan()">Évaluer mon niveau et créer mon programme</button></div><div id="planout">'+(p.plan?planView(p):'')+'</div>'}
function buildPlan(){let p=profile();p.goal=document.querySelector('input[name=goal]:checked')?.value||'muscle';p.age=$('#age').value;p.height=$('#height').value;p.weight=$('#weight').value;p.build=$('#build').value;p.focus=$('#focus').value;p.experience=$('#experience').value;p.days=$('#days').value;p.sport=$('#sport').value.trim();p.limits=$('#limits').value.trim();p.level=p.experience==='new'?'Débutant':p.experience==='some'?'Débutant confirmé':p.experience==='regular'?'Intermédiaire':'Expérience avancée';p.plan=true;save();$('#planout').innerHTML=planView(p)}
function planView(p){let count=Number(p.days)||3;let chosen=p.goal==='endurance'?[exercises[6],exercises[7],exercises[1],exercises[2]]:p.goal==='strength'?[exercises[0],exercises[1],exercises[2],exercises[6]]:[exercises[0],exercises[1],exercises[2],exercises[3],exercises[4],exercises[5],exercises[7]];const focusNames={balanced:'développement équilibré',chest:'pectoraux',back:'dos',shoulders:'épaules',arms:'bras',legs:'jambes et fessiers',core:'abdominaux et gainage'};const focusText={balanced:'Le programme répartit le travail entre les grands groupes musculaires.',chest:'Le programme donnera une priorité raisonnable aux pectoraux, tout en conservant du travail pour le dos et le reste du corps.',back:'Le programme donnera une priorité raisonnable au dos, sans négliger les autres groupes musculaires.',shoulders:'Le programme privilégiera des mouvements d’épaules contrôlés et confortables. Tout mouvement douloureux devra être adapté ou remplacé.',arms:'Le programme ajoutera du travail ciblé pour les biceps et triceps, sans oublier le reste du corps.',legs:'Le programme donnera davantage de place aux jambes et aux fessiers, avec une progression technique.',core:'Le programme intégrera du gainage et du travail du tronc en complément du reste.'};return '<div class="card"><span class="pill">PROGRAMME INDICATIF</span><h2>'+esc(goals[p.goal][0])+'</h2><p class="muted">Niveau estimé : '+esc(p.level)+' · '+count+' séances/semaine</p><div class="notice"><b>Priorité : '+esc(focusNames[p.focus||'balanced'])+'</b><br>'+esc(focusText[p.focus||'balanced'])+'</div><p class="tiny">Ce niveau est une première estimation fondée sur l’expérience déclarée, pas un test de capacité. Fais valider ta technique par un encadrant. Le programme est une base modifiable, pas une prescription médicale.</p>'+chosen.map((e,i)=>'<div class="exercise" style="padding:11px 0;border-top:1px solid var(--line)"><span class="num">'+(i+1)+'</span><div><b>'+e.name+'</b><p>'+e.muscles+' · '+e.sets+' séries · '+e.reps+' · repos '+e.rest+' s</p></div></div>').join('')+'<div class="actions">'+btn('Lancer en mode guidé',"startSession('guided')")+' '+btn('Mode classique',"startSession('classic')",'secondary')+'</div></div>'}
function session(){let p=profile();if(!p)return '<div class="empty">Crée un profil avant de commencer.</div>';if(!p.plan)return '<div class="card"><h2>Ton programme n’est pas encore créé</h2>'+btn('Créer mon programme',"go('program')")+'</div>';return '<h1>Ma séance</h1><p class="muted">Choisis comment tu veux suivre ta séance.</p><div class="grid"><button onclick="startSession(\'classic\')">Mode classique</button><button class="secondary" onclick="startSession(\'guided\')">Mode guidé</button></div><div id="sessionout" class="card"><p class="muted">Le mode guidé affiche un exercice à la fois, avec consignes, séries et repos. Le mode classique affiche toute la liste.</p></div>'}
let activeExercises=[];
function startSession(m){mode=m;currentIndex=0;let p=profile();activeExercises=p.goal==='endurance'?[exercises[6],exercises[7],exercises[1],exercises[2]]:p.goal==='strength'?[exercises[0],exercises[1],exercises[2],exercises[6]]:[exercises[0],exercises[1],exercises[2],exercises[3],exercises[4],exercises[5],exercises[7]];drawSession()}
function drawSession(){let out=$('#sessionout');if(!out){go('session');out=$('#sessionout')}if(mode==='classic'){out.innerHTML='<h2>Séance complète</h2>'+activeExercises.map((e,i)=>exerciseCard(e,i)).join('')+'<button onclick="finishSession()">Terminer et enregistrer</button>';return}let e=activeExercises[currentIndex];out.innerHTML='<div class="topline"><span class="pill">Exercice '+(currentIndex+1)+' / '+activeExercises.length+'</span><span class="tiny">'+Math.round((currentIndex/activeExercises.length)*100)+' %</span></div><div class="progress"><i style="width:'+(currentIndex/activeExercises.length*100)+'%"></i></div><h2 style="margin-top:18px">'+e.name+'</h2><p class="muted">'+e.muscles+' · '+e.sets+' séries · '+e.reps+' répétitions</p>'+videoLink(e)+'<div class="notice">'+e.tip+'</div>'+trackingFields(e,'')+'<div class="actions"><button class="secondary" onclick="startRest('+e.rest+')">Repos '+e.rest+' s</button>'+btn(currentIndex===activeExercises.length-1?'Terminer':'Exercice suivant',currentIndex===activeExercises.length-1?'finishSession()':'nextExercise()')+'</div><div id="timer" class="stat" style="margin-top:12px"></div>'}
function trackingFields(e,suffix){return '<div class="field"><label>Charge utilisée (kg, facultatif)</label><input type="number" min="0" step=".5" id="load'+suffix+'" placeholder="Ex. 20"></div><div class="field"><label>Séries terminées</label><select id="done'+suffix+'">'+Array.from({length:e.sets+1},(_,i)=>'<option value="'+i+'" '+(i===e.sets?'selected':'')+'>'+i+' / '+e.sets+'</option>').join('')+'</select></div><div class="field"><label>Difficulté ressentie</label><select id="effort'+suffix+'"><option value="easy">Facile</option><option value="moderate" selected>Modérée</option><option value="hard">Difficile</option></select></div><div class="field"><label>Douleur pendant l’exercice ?</label><select id="pain'+suffix+'"><option value="no" selected>Non</option><option value="yes">Oui — à signaler</option></select></div>'}function exerciseCard(e,i){return '<div class="card"><div class="exercise"><span class="num">'+(i+1)+'</span><div><b>'+e.name+'</b><p>'+e.muscles+' · '+e.sets+' séries · '+e.reps+' · repos '+e.rest+' s</p></div></div>'+videoLink(e)+'<p class="muted">'+e.tip+'</p>'+trackingFields(e,i)+'</div>'}
function videoLink(e){return '<a class="video" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.video)+'" target="_blank" rel="noopener"><strong>▶ Voir la démonstration vidéo</strong><span class="tiny">Recherche vidéo : '+esc(e.video)+'. Choisis une démonstration claire et vérifie la technique auprès d’un encadrant.</span></a>'}
function nextExercise(){currentIndex++;drawSession()}
function startRest(n){clearInterval(timerId);seconds=n;let t=$('#timer');if(t)t.textContent=seconds+' s';timerId=setInterval(()=>{seconds--;let el=$('#timer');if(el)el.textContent=seconds>0?seconds+' s':'Repos terminé';if(seconds<=0)clearInterval(timerId)},1000)}
function finishSession(){clearInterval(timerId);let p=profile();if(!p)return;let loads=activeExercises.map((e,i)=>{let s=mode==='guided'?'':String(i);return {exercise:e.name,load:$('#load'+s)?.value||'',done:Number($('#done'+s)?.value||0),effort:$('#effort'+s)?.value||'moderate',pain:$('#pain'+s)?.value||'no',targetSets:e.sets,reps:e.reps}});db.logs.push({id:crypto.randomUUID(),pid:p.id,date:new Date().toISOString(),goal:p.goal,mode,exercises:activeExercises.map(e=>e.name),loads});save();alert('Séance enregistrée. Tes charges, séries et sensations alimenteront ton suivi.');go('history')}
function history(){let p=profile();if(!p)return '<div class="empty">Sélectionne ou crée un profil.</div>';let logs=db.logs.filter(x=>x.pid===p.id).reverse();return '<h1>Mon suivi</h1><p class="muted">Historique de tes séances enregistrées.</p><div class="card"><div class="stat">'+logs.length+'</div><div class="tiny">Séances enregistrées pour '+esc(p.name)+'</div></div>'+(logs.map(l=>'<div class="card"><b>'+new Date(l.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</b><p class="muted">'+l.exercises.length+' exercices · '+esc(goals[l.goal]?.[0]||'Séance')+'</p>'+l.exercises.map(x=>'<span class="pill">'+esc(x)+'</span> ').join('')+'</div>').join('')||'<div class="empty">Pas encore de séance. Lance ton premier entraînement !</div>')}
function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='iron-coach-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.profiles)||!Array.isArray(d.logs))throw 0;db=d;save();theme();go('home');alert('Sauvegarde importée.')}catch(e){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)}

function coachAnalysis(p){
 const logs=db.logs.filter(x=>x.pid===p.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
 const recent=logs.slice(-5), total=logs.length;
 const last=recent[recent.length-1], prev=recent[recent.length-2];
 let notes=[];
 if(!p.plan) notes.push("Complète ton questionnaire pour que je puisse proposer un programme de départ.");
 if(total===0) notes.push("Aucune séance enregistrée : commence par une séance facile et note les charges réellement utilisées.");
 else {
  if(total<3) notes.push("J’ai encore peu de données. Après quelques séances enregistrées, les tendances seront plus fiables.");
  else notes.push(total+" séances sont enregistrées. Les charges, séries terminées et sensations sont maintenant suivies pour affiner les comparaisons.");
  if(last&&prev){
   const gap=(new Date(last.date)-new Date(prev.date))/86400000;
   if(gap<1) notes.push("Deux séances sont très rapprochées. Prévois une récupération suffisante avant de retravailler intensément les mêmes muscles.");
   else if(gap>10) notes.push("La dernière séance date de plus de 10 jours. Reprends progressivement plutôt que de vouloir rattraper les séances manquées.");
   else notes.push("L’intervalle entre tes deux dernières séances est d’environ "+Math.round(gap)+" jour(s). Garde un rythme que tu peux tenir sans fatigue persistante.");
  }
 }
 const byExercise={};recent.forEach(log=>(log.loads||[]).forEach(x=>{if(!byExercise[x.exercise])byExercise[x.exercise]=[];byExercise[x.exercise].push(x)}));Object.entries(byExercise).forEach(([name,arr])=>{const valid=arr.filter(x=>x.load!==""&&Number.isFinite(Number(x.load)));if(valid.length>=2){const x=valid[valid.length-2],y=valid[valid.length-1];if(y.pain==="yes")notes.push("Tu as signalé une douleur sur "+name+". Ne cherche pas à augmenter la charge : arrête ou adapte ce mouvement et demande un avis professionnel si cela persiste.");else if(Number(y.load)>Number(x.load)&&Number(y.done)>=Number(x.done))notes.push("Sur "+name+", la charge enregistrée est passée de "+x.load+" à "+y.load+" kg avec au moins autant de séries terminées. C’est un signe encourageant, à confirmer avec une technique propre et des sensations confortables.");else if(Number(y.load)<Number(x.load))notes.push("Sur "+name+", la charge a diminué. Ce n’est pas forcément une régression : fatigue, réglage ou choix volontaire peuvent l’expliquer. Ne force pas pour retrouver l’ancienne charge.");}});if(p.limits) notes.push("Limitation déclarée : « "+p.limits+" ». Évite les mouvements qui déclenchent une douleur et demande conseil à un professionnel si elle persiste.");
 if(Number(p.days)>=5) notes.push("Avec 5 séances ou plus, la récupération et la répartition des groupes musculaires deviennent particulièrement importantes. Plus de séances ne signifie pas automatiquement plus de progrès.");
 return {logs,total,notes,last};
}
function coach(){
 const p=profile();
 if(!p)return '<h1>Coach IA</h1><div class="card">Crée un profil pour démarrer.</div>'+btn('Créer un profil',"go('profiles')");
 const a=coachAnalysis(p);
 return '<h1>Coach IRON</h1><p class="muted">Ton assistant d’entraînement analyse les informations de ton profil et tes séances enregistrées.</p><div class="card"><div class="topline"><span class="pill">ANALYSE AUTOMATIQUE</span><span class="pill">'+a.total+' séance(s)</span></div><h2>Mon bilan</h2>'+a.notes.map(n=>'<p>• '+esc(n)+'</p>').join('')+'<p class="tiny">Cette version utilise des règles locales, pas un modèle génératif connecté. Elle ne remplace pas un coach diplômé ni un avis médical.</p></div><div class="card"><h2>Que veux-tu demander au coach ?</h2><div class="grid"><button class="secondary" onclick="coachAsk(\\'programme\\')">Améliorer mon programme</button><button class="secondary" onclick="coachAsk(\\'progression\\')">Analyser ma progression</button><button class="secondary" onclick="coachAsk(\\'recuperation\\')">Récupération</button><button class="secondary" onclick="coachAsk(\\'objectif\\')">Choisir mon objectif</button></div><div class="field"><label>Ou écris ta question</label><input id="coachQuestion" placeholder="Ex. Comment organiser mes séances ?"><button onclick="coachAsk()">Envoyer ma question</button></div><div id="coachAnswer" class="notice" style="display:none"></div></div><div class="card"><h2>Prochaine étape</h2><p class="muted">Enregistre chaque séance avec tes charges et tes sensations. Plus les données sont précises, plus les conseils de suivi seront utiles.</p>'+btn('Enregistrer une séance',"go('session')")+' '+btn('Modifier mon profil',"go('program')",'secondary')+'</div>';
}
function coachAsk(topic){
 const p=profile();if(!p)return;
 const a=coachAnalysis(p);const q=$('#coachQuestion')?.value.trim()||'';
 let answer='';
 if(topic==='progression'||/progress|stagn|charge|évolu/i.test(q)){
  answer=a.total<3?'Je n’ai pas encore assez de séances pour conclure. Enregistre plusieurs séances avec les exercices, les charges et les répétitions.':"Je peux constater ta régularité, mais tes anciennes séances ne contiennent pas assez de détails sur les répétitions et les séries pour affirmer que tu progresses ou stagnes. Note ces informations à la prochaine séance.";
 }else if(topic==='recuperation'||/repos|récup|fatigu|douleur/i.test(q)){
  answer="Laisse du temps aux muscles sollicités pour récupérer. Si tu ressens une douleur, ne force pas à travers elle et adapte ou arrête l’exercice. Une douleur persistante mérite l’avis d’un professionnel de santé.";
 }else if(topic==='objectif'||/objectif|choisir/i.test(q)){
  answer="Choisis prise de muscle si tu veux développer tes muscles, force si tu veux surtout améliorer tes performances sur des mouvements, endurance pour tenir un effort, remise en forme pour une condition générale, ou préparation physique pour compléter un sport. En cas d’hésitation, remise en forme ou prise de muscle avec un programme équilibré est un point de départ possible.";
 }else if(topic==='programme'||/programme|exercice|séance|split/i.test(q)){
  answer="Ton programme doit respecter ton expérience, le nombre de jours disponibles, tes préférences et tes éventuelles limitations. Évite de multiplier les exercices pour un seul muscle. Répartis les groupes musculaires sur la semaine et garde des jours de récupération. Va dans Programme pour ajuster tes choix.";
 }else{
  answer=q?"Je peux répondre aux sujets entraînement, programme, progression et récupération. Pour être précis, indique ton objectif, ton nombre de séances et ce que tu fais actuellement.":"Choisis une question proposée ou écris ce que tu souhaites améliorer.";
 }
 const out=$('#coachAnswer');if(out){out.style.display='block';out.textContent=answer;}
}

function render(){let app=$('#app');try{theme();let p=profile();app.innerHTML=page==='home'?home():page==='profiles'?profilePage():page==='program'?program():page==='session'?session():page==='coach'?coach():history()}catch(err){console.error('IRON COACH render error:',err);app.innerHTML='<section class="card"><h1>Erreur de chargement</h1><p>Une ancienne donnée de profil empêche l’affichage. Tes données ne sont pas supprimées.</p><p class="tiny">'+esc(err&&err.message?err.message:'Erreur inconnue')+'</p><button onclick="location.reload()">Réessayer</button><button class="secondary" onclick="localStorage.removeItem(\'ironcoach\');location.reload()">Réinitialiser les données locales</button></section>'}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script><script>

 var app=document.getElementById('app');
 if(app)app.innerHTML='<section class="card"><h1>Erreur JavaScript détectée</h1><p>Le navigateur a bloqué le démarrage du coach.</p><p class="tiny">'+String(e.message||'Erreur inconnue')+' — ligne '+(e.lineno||'?')+'</p><p>Envoie une capture de ce message.</p></section>';
});
window.addEventListener('unhandledrejection',function(e){
 var app=document.getElementById('app');
 if(app)app.innerHTML='<section class="card"><h1>Erreur au démarrage</h1><p class="tiny">'+String(e.reason&&e.reason.message||e.reason||'Erreur inconnue')+'</p></section>';
});
</script></body></html>
